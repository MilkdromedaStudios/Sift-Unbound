plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"sift_unbound" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "sift_unbound_test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	from("CREDITS.md")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// Let the dev server read console commands (handy for testing and the smoke-test script).
tasks.named("runServer") {
	standardInput = System.in
}

// Optional shader photo shoot: tools/photoshoot.sh downloads Sodium, Iris and a shader pack into photoshoot/
// (git-ignored) and runs `runClientGameTest -Pphotoshoot`. Nothing here affects the normal build or the mod jar.
if (project.hasProperty("photoshoot")) {
	dependencies {
		gametestRuntimeOnly fileTree(dir: "photoshoot/mods", include: "*.jar")
	}
	tasks.named("runClientGameTest") {
		jvmArgs "-Dsiftunbound.photoshoot=true"
		if (project.property("photoshoot") == "resume") {
			jvmArgs "-Dsiftunbound.photoshoot.resume=true" // keep the shots an interrupted shoot already took
		}
		// Iris draws shader packs with OpenGL, so never let the game fall back to its Vulkan backend for the shoot.
		args "--graphicsBackend", "opengl"
		doFirst {
			copy { from "photoshoot/shaderpacks"; into "build/run/clientGameTest/shaderpacks" }
			copy { from "photoshoot/config"; into "build/run/clientGameTest/config" }
		}
	}
}
