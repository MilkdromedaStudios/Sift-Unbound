# Publishes a GitHub release when a version tag (v0.1.0, v1.2.3 ...) is pushed, then uploads the jar to Modrinth.
# The release also carries Sift Unbound Shaders (the Iris pack in shaderpack/), zipped with the same version.
# The tag must match mod_version in gradle.properties; release notes come from CHANGELOG.md.
# Modrinth: the project is w1FbpX4X (override with a MODRINTH_PROJECT repository variable); set the secret
# MODRINTH_API_KEY in Settings -> Secrets and variables -> Actions. Without the key the Modrinth step is skipped.
# CurseForge: the project is 1798861 (override with a CURSEFORGE_PROJECT variable); set the secret CURSEFORGE_API_KEY.
# Without it the CurseForge step is skipped.
name: release

on:
  push:
    tags:
      - 'v*'
  # Or run it by hand (Actions tab -> release -> Run workflow): the tag v<version> is created on the chosen ref.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal mod_version in gradle.properties (e.g. 0.1.0)
        required: true
      ref:
        description: Branch or commit to release
        required: false
        default: main
  # Called by auto-release.yml after it has committed and tagged the new version on main.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
      REF: ${{ inputs.ref || github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check the tag matches gradle.properties
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match mod_version=$version in gradle.properties"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          chmod +x ./gradlew
          python3 tools/check_assets.py
          ./gradlew build runGameTest --stacktrace
          tools/server_smoke_test.sh
      - name: Build the shader pack
        run: python3 tools/build_shaderpack.py
      - name: Extract release notes
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See CHANGELOG.md" > release-notes.md; fi
          cat release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/libs/*.jar build/shaderpack/*.zip --clobber
          else
            # creates the tag on the checked-out commit when it doesn't exist yet (manual runs)
            gh release create "$TAG" build/libs/*.jar build/shaderpack/*.zip --target "$(git rev-parse HEAD)" \
              --title "The Sift Unbound $VERSION (Minecraft 26.3)" --notes-file release-notes.md
          fi
      - name: Publish to Modrinth
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT || 'w1FbpX4X' }}  # The Sift Unbound on Modrinth
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$')
          python3 tools/publish_modrinth.py --version "$VERSION" --jar "$jar" --changelog release-notes.md
      - name: Publish to CurseForge
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_PROJECT: ${{ vars.CURSEFORGE_PROJECT || '1798861' }}  # The Sift Unbound on CurseForge
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$')
          python3 tools/publish_curseforge.py --version "$VERSION" --jar "$jar" --changelog release-notes.md
