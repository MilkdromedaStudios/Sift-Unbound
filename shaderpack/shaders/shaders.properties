# Sift Unbound Shaders - an original Iris shader pack made for The Sift Unbound (works in every dimension).

clouds=fancy
oldLighting=false
underwaterOverlay=true
vignette=false
sun=true
moon=true

# ---- profiles (pick one at the top of the options screen)
profile.POTATO=!SHADOWS !WAVING_PLANTS !CLOUD_SHADING !WATER_SHINE shadowMapResolution=512 shadowDistance=48.0 SHADOW_SAMPLES=1 SHARPEN=0.0 VIGNETTE=0.0
profile.LOW=SHADOWS !WAVING_PLANTS CLOUD_SHADING WATER_SHINE shadowMapResolution=1024 shadowDistance=64.0 SHADOW_SAMPLES=1 SHARPEN=0.2 VIGNETTE=0.15
profile.MEDIUM=SHADOWS WAVING_PLANTS CLOUD_SHADING WATER_SHINE shadowMapResolution=2048 shadowDistance=112.0 SHADOW_SAMPLES=2 SHARPEN=0.4 VIGNETTE=0.25
profile.HIGH=SHADOWS WAVING_PLANTS CLOUD_SHADING WATER_SHINE shadowMapResolution=3072 shadowDistance=160.0 SHADOW_SAMPLES=3 SHARPEN=0.4 VIGNETTE=0.25
profile.ULTRA=SHADOWS WAVING_PLANTS CLOUD_SHADING WATER_SHINE shadowMapResolution=4096 shadowDistance=224.0 SHADOW_SAMPLES=4 SHARPEN=0.6 VIGNETTE=0.25

# ---- options screen
screen=<profile> <empty> [LIGHTING] [SHADOW_OPTIONS] [WORLD] [POST]
screen.LIGHTING=SIFT_TIDE_LIGHT BLOCKLIGHT_WARMTH WATER_SHINE sunPathRotation
screen.SHADOW_OPTIONS=SHADOWS SHADOW_SAMPLES SHADOW_STRENGTH shadowMapResolution shadowDistance
screen.WORLD=WAVING_PLANTS WAVING_SPEED CLOUD_SHADING CLOUD_OPACITY
screen.POST=EXPOSURE CONTRAST VIBRANCE SHARPEN VIGNETTE
sliders=SHADOW_SAMPLES SHADOW_STRENGTH shadowMapResolution shadowDistance sunPathRotation WAVING_SPEED CLOUD_OPACITY BLOCKLIGHT_WARMTH EXPOSURE CONTRAST VIBRANCE SHARPEN VIGNETTE

# ---- blending: clouds and weather are see-through
blend.gbuffers_clouds=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
